{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Login</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>
        <p class="mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
